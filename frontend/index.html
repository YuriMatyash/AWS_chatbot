<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Chatbot</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>AWS Chatbot</h1>
      <p class="hint">Frontend hosted in Amplify. Backend served by API Gateway + Lambda.</p>

      <section id="chatWindow" class="chat-window" aria-live="polite"></section>

      <form id="chatForm" class="chat-form">
        <input id="messageInput" type="text" placeholder="Type your message..." required />
        <button type="submit">Send</button>
      </form>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
